name: Publish Telegram hourly and daily briefs

on:
  push:
    branches: [main]
    paths:
      - 'outbox/hourly/*.json'
      - 'outbox/daily/*.json'
  workflow_dispatch:
    inputs:
      outbox_path:
        description: 'Exact outbox/hourly/ID.json or outbox/daily/DATE.json file'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate and preview without posting
        env:
          OUTBOX_PATH: ${{ inputs.outbox_path }}
        shell: bash
        run: |
          if [ -n "$OUTBOX_PATH" ]; then
            python -m src.publish_v2 --path "$OUTBOX_PATH" --dry-run
          else
            python -m src.publish_v2 --event "$GITHUB_EVENT_PATH" --dry-run
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      OUTBOX_PATH: ${{ inputs.outbox_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Publish to Telegram
        shell: bash
        run: |
          # Resolve the triggering outbox file BEFORE refreshing main.
          # The live published hourly index must include receipts from
          # previous jobs when enforcing the cross-hour NABU/SAPO cap.
          if [ -n "$OUTBOX_PATH" ]; then
            publish_path="$OUTBOX_PATH"
          else
            publish_path="$(python -c 'from pathlib import Path; import os; from src.publish_v2 import path_from_github_event; print(path_from_github_event(Path(os.environ["GITHUB_EVENT_PATH"])))')"
          fi
          git fetch origin main
          git reset --hard origin/main
          python -m src.publish_v2 --path "$publish_path"
      - name: Record message IDs and hourly index
        run: |
          git config user.name "russianewstoday-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if git diff --cached --quiet; then
            echo "No new published receipts"
          else
            git commit -m "data: log Telegram brief publication"
            # Retry only the Git push, never collection or Telegram delivery.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            echo "::error::Unable to persist committed pipeline data after three push attempts"
            exit 1
          fi
