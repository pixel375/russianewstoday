name: Collect Telegram news (hourly)

on:
  schedule:
    # Five minutes past every UTC hour. Each run collects the previous
    # completed UTC hour, not a rolling window with overlapping posts.
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect.py'
      - 'src/hourly.py'
      - 'src/publish_v2.py'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: hourly-telegram-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect previous complete hour
        run: python -m src.hourly
      - name: Commit hourly snapshot and archive
        run: |
          git config user.name "russianewstoday-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hourly/
          if git diff --cached --quiet; then
            echo "No new completed hour to commit"
          else
            git commit -m "data: collect last completed Telegram hour"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
