name: Collect Telegram news

on:
  schedule:
    # 15:30 UTC = 09:30 CST / 10:30 CDT (Winnipeg).
    - cron: '30 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect.py'
      - 'src/publish.py'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: daily-telegram-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Crawl the full last 24 hours
        run: python -m src.collect
      - name: Commit source snapshot
        run: |
          git config user.name "russianewstoday-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "data: update 24-hour Telegram collection"
            git push origin HEAD:main
          fi
