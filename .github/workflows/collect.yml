name: Collect Telegram news (hourly)

on:
  schedule:
    # Off-peak primary and retry slots. GitHub can delay/drop cron events.
    # Both runs collect the last fully completed UTC hour.
    - cron: '9 * * * *'
    - cron: '14 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect.py'
      - 'src/hourly.py'
      - 'src/publish_v2.py'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'
      - 'triggers/hourly.json'

permissions:
  contents: write

concurrency:
  group: hourly-telegram-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect exact requested hour and recent missing windows
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [ "$EVENT_NAME" = push ]; then
            hour="$(python -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); files=[f for c in e.get("commits",[]) for f in c.get("added",[])+c.get("modified",[])]; print(json.load(open("triggers/hourly.json"))["hour_id"] if "triggers/hourly.json" in files else "")')"
            if [ -z "$hour" ] && git diff-tree --no-commit-id --name-only -r HEAD | grep -qx triggers/hourly.json; then
              hour="$(python -c 'import json; print(json.load(open("triggers/hourly.json"))["hour_id"])')"
            fi
            if [ -n "$hour" ]; then args+=(--hour "$hour"); fi
          fi
          # Resolve the triggering request first, then collect against live main.
          # Queued runs may otherwise recreate archives from an outdated checkout.
          git fetch origin main
          git reset --hard origin/main
          python -m src.hourly "${args[@]}" --repair-recent
      - name: Commit hourly snapshot and archive
        if: ${{ always() }}
        run: |
          git config user.name "russianewstoday-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hourly/
          if git diff --cached --quiet; then
            echo "No new completed hour to commit"
          else
            git commit -m "data: collect last completed Telegram hour"
            # Retry only the Git push, never collection or Telegram delivery.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            echo "::error::Unable to persist committed pipeline data after three push attempts"
            exit 1
          fi
